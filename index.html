<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Google</title>
<style>
  /* Reset some default styles */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, sans-serif;
    background-color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Google logo placeholder - replace with actual logo if desired */
  .logo {
    width: 272px;
    height: 92px;
    background: url('https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png') no-repeat center/contain;
    margin-bottom: 20px;
  }

  /* Search box container styled like Google */
  .search-box {
    display: flex;
    align-items: center;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    border-radius: 24px;
    padding: 10px 20px;
  }

  /* Input styles */
  input[type="text"] {
    flex: 1;
    font-size: 16px;
    border: none;
    outline: none;
    padding: 10px 15px;
    border-radius: 24px;
  }

  /* Dropdown style */
  select {
    margin-right: 10px;
    padding: 8px 12px;
    font-size: 14px;
    border-radius: 24px;
    border: 1px solid #dadce0;
  }

  /* Search button is hidden, search is triggered by Enter key */
  button {
    display: none;
  }

  /* Results container */
  #results {
    margin-top: 20px;
    width: 100%;
    max-width: 800px;
  }
</style>
</head>
<body>

<!-- Google Logo -->
<div class="logo"></div>

<!-- Search form -->
<form id="searchForm" class="search-box" onsubmit="return false;">
  <select id="engine">
    <option value="duckduckgo">DuckDuckGo</option>
    <option value="google">Google</option>
  </select>
  <input type="text" id="query" placeholder="Search" autofocus />
</form>

<!-- Search results -->
<div id="results"></div>

<script>
  // Trigger search on Enter keypress
  document.getElementById('query').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      performSearch();
    }
  });

  async function performSearch() {
    const query = document.getElementById('query').value.trim();
    const engine = document.getElementById('engine').value;
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = 'Loading...';

    if (!query) {
      resultsDiv.innerHTML = '';
      return;
    }

    try {
      const response = await fetch(`/search?q=${encodeURIComponent(query)}&engine=${engine}`);
      const html = await response.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      resultsDiv.innerHTML = '';

      if (engine === 'duckduckgo') {
        const links = doc.querySelectorAll('.result a');
        if (links.length === 0) {
          resultsDiv.innerHTML = '<p>No results found.</p>';
        } else {
          links.forEach(link => {
            const url = link.href;
            const title = link.textContent;
            resultsDiv.innerHTML += `
              <div style="margin-bottom:15px;">
                <a href="${url}" target="_blank" rel="noopener noreferrer" style="font-size:20px;color:#1a0dab;text-decoration:none;">${title}</a>
              </div>`;
          });
        }
      } else {
        // Google results - show raw HTML for demo
        resultsDiv.innerHTML = html;
      }
    } catch (err) {
      resultsDiv.innerHTML = 'Error fetching results.';
    }
  }
</script>

</body>
</html>
