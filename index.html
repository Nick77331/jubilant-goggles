<!DOCTYPE html>
<html>
<head>
    <title>Mini Roblox Clone</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        #messages { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; border: 1px solid #ccc; background: #fff; margin-bottom: 20px; }
        #messages li { padding: 8px 12px; border-bottom: 1px solid #eee; }
        #form { display: flex; justify-content: center; }
        #input { width: 80%; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; margin-left: 10px; cursor: pointer; }
        /* Optional: add some hover effects */
        button:hover { background-color: #ddd; }
    </style>
</head>
<body>
    <h1>Mini Roblox Clone</h1>
    <ul id="messages"></ul>
    <form id="form" autocomplete="off">
        <input id="input" autocomplete="off" placeholder="Type a message..." />
        <button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        // When user submits the form, send message
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim() !== '') {
                socket.emit('chat message', input.value);
                input.value = '';
                input.focus();
            }
        });

        // When a message is received, add it to the message list
        socket.on('chat message', (data) => {
            const li = document.createElement('li');
            li.textContent = `${data.id}: ${data.msg}`;
            messages.appendChild(li);
            // Scroll to the latest message
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
