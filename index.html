<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Google-like Search</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .search-box {
    width: 100%;
    max-width: 600px;
    display: flex;
    align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    border-radius: 24px;
    padding: 10px 20px;
  }

  input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    font-size: 18px;
    padding: 10px 15px;
    border-radius: 24px;
  }

  select {
    margin-right: 10px;
    padding: 10px 15px;
    border-radius: 24px;
    border: 1px solid #ddd;
    font-size: 16px;
  }

  button {
    background-color: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    margin-left: 10px;
    transition: background 0.3s;
  }

  button:hover {
    background-color: #1558b0;
  }

  #results {
    width: 100%;
    max-width: 800px;
    margin-top: 30px;
    padding: 0 20px;
  }

  .result {
    padding: 15px;
    border-bottom: 1px solid #eee;
  }

  .result a {
    font-size: 20px;
    color: #1a0dab;
    text-decoration: none;
  }

  .result a:hover {
    text-decoration: underline;
  }

  /* Responsive */
  @media(max-width: 600px){
    .search-box {
      flex-direction: column;
    }
    input[type="text"] {
      width: 100%;
      margin-bottom: 10px;
      border-radius: 12px;
    }
    select {
      width: 100%;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      border-radius: 12px;
    }
  }
</style>
</head>
<body>

<div class="search-box">
  <select id="engine">
    <option value="duckduckgo">DuckDuckGo</option>
    <option value="google">Google</option>
  </select>
  <input type="text" id="query" placeholder="Search the web" />
  <button id="searchBtn">Search</button>
</div>

<div id="results"></div>

<script>
  document.getElementById('searchBtn').addEventListener('click', async () => {
    const query = document.getElementById('query').value.trim();
    const engine = document.getElementById('engine').value;
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = 'Loading...';

    if (!query) {
      resultsDiv.innerHTML = 'Please enter a search term.';
      return;
    }

    try {
      const res = await fetch(`/search?q=${encodeURIComponent(query)}&engine=${engine}`);
      const html = await res.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      resultsDiv.innerHTML = '';

      if (engine === 'duckduckgo') {
        const links = doc.querySelectorAll('.result a');
        if (links.length === 0) {
          resultsDiv.innerHTML = '<p>No results found.</p>';
        } else {
          links.forEach(link => {
            const url = link.href;
            const title = link.textContent;
            resultsDiv.innerHTML += `
              <div class="result">
                <a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a>
              </div>
            `;
          });
        }
      } else if (engine === 'google') {
        // Google results are complex; show raw HTML
        resultsDiv.innerHTML = html;
      }
    } catch (e) {
      resultsDiv.innerHTML = 'Error fetching results.';
    }
  });
</script>

</body>
</html>
