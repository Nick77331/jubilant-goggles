<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search</title>
<!-- Your styles here (same as before) -->
<style>
  /* ... same styles as previous ... */
</style>
</head>
<body>
<h1>Search</h1>
<form id="searchForm">
  <input type="text" id="query" placeholder="Enter search term" required />
  <select id="engine">
    <option value="duckduckgo">DuckDuckGo</option>
    <option value="google">Google</option>
  </select>
  <button type="submit">Search</button>
</form>

<div id="results"></div>

<script>
  document.getElementById('searchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const query = document.getElementById('query').value;
    const engine = document.getElementById('engine').value;
    const responseDiv = document.getElementById('results');
    responseDiv.innerHTML = '<p>Loading...</p>';

    try {
      const response = await fetch(`/search?q=${encodeURIComponent(query)}&engine=${engine}`);
      const html = await response.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      if (engine === 'duckduckgo') {
        const links = doc.querySelectorAll('.result a');
        if (links.length === 0) {
          responseDiv.innerHTML = '<p>No results found.</p>';
        } else {
          responseDiv.innerHTML = '';
          links.forEach(link => {
            const url = link.href;
            const title = link.textContent;
            responseDiv.innerHTML += `
              <div class="result">
                <a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a>
              </div>
            `;
          });
        }
      } else if (engine === 'google') {
        // For Google, parsing is more complex; for simplicity, just show raw HTML
        responseDiv.innerHTML = html;
      }
    } catch (err) {
      responseDiv.innerHTML = '<p>Error fetching results.</p>';
    }
  });
</script>
</body>
</html>
